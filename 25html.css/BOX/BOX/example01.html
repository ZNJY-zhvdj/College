<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>边框样式</title>
	<style>
		h2{border:double;}
		.one{border-top:dotted;
		    border-bottom: dotted;
			border-left:solid;
			border-right: solid;
		}
		.two{border-top:solid;
		     border-bottom: dashed;
		     border-right: dotted;
		border-left: dotted;}
	</style>

</head>
<body>
<h2>四条边框为双实线</h2>
<p class="one">上边框和下边框为点线，左边框和右边框为单实线</p>
<p class="two">上边框为单实线，左边框和右边框为点线，下边框为虚线</p>
</body>
</html>
