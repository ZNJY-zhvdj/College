<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>综合设置边框</title>
	<style>
		h2{
			border-bottom:1px solid;
			
		}
		.test{
			border-top:10px solid red;
			border-right:9px dotted purple;
			border-bottom:8px double blue;
			border-left: 7px dashed green;
		}
		.pingmian{
			border-top:10px solid red;
			border-right:9px dotted purple;
			border-bottom:8px double blue;
			border-left: 7px dashed green;
		}
	</style>

</head>
<body>
<h2 align="center">设置边框属性</h2>
<p class="text">该段落使用单侧边框的综合属性，分别给上、右、下、左四个边设置不同的样式。</p>
<img class="pingmian" src="tu.png" alt="图片" />
</body>
</html>
